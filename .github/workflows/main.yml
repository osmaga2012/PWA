
name: Desplegar Gestion Maritima en Azure

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descarga PWA
        uses: actions/checkout@v4
        with:
             path: PWA
      - name: Descargar CRM.Dtos
        uses: actions/checkout@v4
        with:
          repository: osmaga2012/CRM
          path: CRM
          # Necesario si CRM.Dtos es privado:
          token: ${{ secrets.CRM_DTOS_TOKEN }}
      - name: Instalar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Localizar CRM.Dtos
        run: |
          echo "Proyectos disponibles:"
          find ./CRM -name "*.csproj"

      - name: Compilar y publicar Blazor
        run: |
          dotnet add ./PWA/PWA.csproj reference ./CRM/CRM.Dtos/CRM.Dtos.csproj
          dotnet publish ./PWA/PWA.csproj -c Release -o ./publish
            
      - name: Actualizar y verificar appsettings
        env:
           API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
            python3 - <<'PY'
            import json
            import os
            from pathlib import Path
  
            url = os.environ.get("API_BASE_URL", "").strip()
  
            if not url or "localhost" in url:
                raise SystemExit(
                    "ERROR: API_BASE_URL no está configurada correctamente"
                )
  
            root = Path("./publish/wwwroot/new")
  
            if not (root / "index.html").is_file():
                raise SystemExit(
                    f"ERROR: No existe index.html en {root}"
                )
  
            archivo = root / "appsettings.json"
  
            if not archivo.is_file():
                raise SystemExit(
                    f"ERROR: No existe {archivo}"
                )
  
            config = json.loads(archivo.read_text(encoding="utf-8"))
            config["ApiSettings"]["BaseUrl"] = url
  
            archivo.write_text(
                json.dumps(config, indent=2, ensure_ascii=False),
                encoding="utf-8"
            )
  
            comprobacion = json.loads(
                archivo.read_text(encoding="utf-8")
            )
  
            assert comprobacion["ApiSettings"]["BaseUrl"] == url
  
            print("Configuración actualizada correctamente")
            print("URL de API:", url)
            print("Archivo:", archivo.resolve())
            PY
      
      - name: Verificar artefacto final
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("./publish/wwwroot/new")
          archivo = root / "appsettings.json"

          config = json.loads(archivo.read_text(encoding="utf-8"))

          assert config["ApiSettings"]["BaseUrl"] == os.environ["API_BASE_URL"]
          assert (root / "index.html").exists()

          print("Artefacto preparado correctamente")
          print("BaseUrl:", config["ApiSettings"]["BaseUrl"])
          print("Archivos de configuración:")
          for path in root.rglob("appsettings*.json"):
              print(path)
          PY

            
      - name: Desplegar en Azure
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: ./publish/wwwroot/new
          output_location: ''
          skip_app_build: true


name: Desplegar Gestion Maritima en Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descarga PWA
        uses: actions/checkout@v4
        with:
             path: PWA
      - name: Descargar CRM.Dtos
        uses: actions/checkout@v4
        with:
          repository: osmaga2012/CRM
          path: CRM
          # Necesario si CRM.Dtos es privado:
          token: ${{ secrets.CRM_DTOS_TOKEN }}
      - name: Instalar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compilar y publicar Blazor
        run: dotnet publish ./PWA/PWA.csproj -c Release -o ./publish

      - name: Desplegar en Azure
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: ./publish/wwwroot
          output_location: ''
          skip_app_build: true

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>PWA - CRM</title>
    <base href="/" />
    
    <!-- PWA Meta Tags -->
    <meta name="description" content="Aplicación CRM Progressive Web App" />
    <meta name="theme-color" content="#03173d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CRM PWA" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json" />
    
    <!-- Icons -->
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    
    <!-- Fonts and Styles -->
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link href="css/login.css" rel="stylesheet" />
    <link href="PWA.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;">
            <svg style="width: 64px; height: 64px; animation: spin 1s linear infinite;" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10" stroke="#594ae2" stroke-width="4" fill="none" stroke-dasharray="60" stroke-linecap="round" />
            </svg>
            <p style="margin-top: 20px; color: #594ae2; font-family: Roboto, sans-serif;">Cargando aplicación...</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        Ha ocurrido un error inesperado.
        <a href="" class="reload">Recargar</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="js/app.js"></script>
    
    <script>
        (async () => {
            const swVersion = '20260629-scope-assets';
            const swStorageKey = 'crm_pwa_sw_version';
            const swDevResetKey = 'crm_pwa_sw_dev_reset_version';
            const appBase = document.querySelector('base')?.getAttribute('href') || '/';
            const serviceWorkerUrl = `${appBase}service-worker.js?v=${swVersion}`;
            const isLocalDevelopment = ['localhost', '127.0.0.1', '[::1]'].includes(window.location.hostname);

            const registerCurrentWorker = () => {
                return navigator.serviceWorker.register(serviceWorkerUrl, { scope: appBase })
                    .then(registration => {
                        console.log('Service Worker registrado:', registration);
                        return registration;
                    })
                    .catch(error => console.error('Error al registrar Service Worker:', error));
            };

            const clearOldWorkers = async () => {
                if (!('serviceWorker' in navigator)) {
                    return;
                }

                const registrations = await navigator.serviceWorker.getRegistrations();
                await Promise.all(registrations.map(registration => registration.unregister()));

                if (window.caches && caches.keys) {
                    const cacheNames = await caches.keys();
                    await Promise.all(cacheNames.map(cacheName => caches.delete(cacheName)));
                }

                localStorage.setItem(swStorageKey, swVersion);
            };

            if (isLocalDevelopment && localStorage.getItem(swDevResetKey) !== swVersion) {
                await clearOldWorkers();
                localStorage.setItem(swDevResetKey, swVersion);

                if (navigator.serviceWorker?.controller) {
                    window.location.reload();
                    return;
                }
            }

            await Blazor.start();

            if ('serviceWorker' in navigator) {
                const currentVersion = localStorage.getItem(swStorageKey);
                if (currentVersion !== swVersion) {
                    await clearOldWorkers();
                }

                await registerCurrentWorker();
            }
        })().catch(error => console.error('Error al iniciar la aplicacion:', error));
    </script>
    
    <style>
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        #blazor-error-ui {
            background: lightyellow;
            bottom: 0;
            box-shadow: 0 -1px 2px rgba(0, 0, 0, 0.2);
            display: none;
            left: 0;
            padding: 0.6rem 1.25rem 0.7rem 1.25rem;
            position: fixed;
            width: 100%;
            z-index: 1000;
        }

        #blazor-error-ui .dismiss {
            cursor: pointer;
            position: absolute;
            right: 0.75rem;
            top: 0.5rem;
        }
    </style>
</body>

</html>
